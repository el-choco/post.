server {
    listen 80;
    server_name _;
    client_max_body_size 40m;
    # Resolve the Compose service through Docker DNS at request time. This lets
    # Nginx start while the backend is unavailable and follow container IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Revalidate the app entry point after image updates instead of keeping old bundles.
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location = /version.json {
        root /usr/share/nginx/html;
        expires -1;
    }
    location /api/ {
        set $backend_service backend:3000;
        # Preserve the original /api/ path, query parameters and escaped values.
        proxy_pass http://$backend_service$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
        add_header Cache-Control "no-store" always;
    }
}
