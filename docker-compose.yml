services:
  frontend:
    image: ${DOCKERHUB_NAMESPACE:-paquele}/post-webmail-frontend:${WEBMAIL_VERSION:-latest}
    ports:
      - "${WEBMAIL_PORT:-8886}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  backend:
    image: ${DOCKERHUB_NAMESPACE:-paquele}/post-webmail-backend:${WEBMAIL_VERSION:-latest}
    init: true
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      ALLOW_PRIVATE_CALDAV: ${ALLOW_PRIVATE_CALDAV:-false}
      FILES_MAX_UPLOAD_MB: ${FILES_MAX_UPLOAD_MB:-1024}
      FILES_QUOTA_MB: ${FILES_QUOTA_MB:-5120}
      ONLYOFFICE_ENABLED: ${ONLYOFFICE_ENABLED:-false}
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-}
      ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL:-}
      ONLYOFFICE_CALLBACK_BASE_URL: ${ONLYOFFICE_CALLBACK_BASE_URL:-}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      ONLYOFFICE_MAX_FILE_MB: ${ONLYOFFICE_MAX_FILE_MB:-50}
    volumes:
      - ${WEBMAIL_DATA_DIR:-webmail_data}:/app/data
    networks:
      default:
        aliases:
          - backend
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  webmail_data:
