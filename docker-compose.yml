services:
  frontend:
    image: ${DOCKERHUB_NAMESPACE:-paquele}/post-webmail-frontend:${WEBMAIL_VERSION:-latest}
    ports:
      - "${WEBMAIL_PORT:-8886}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  backend:
    image: ${DOCKERHUB_NAMESPACE:-paquele}/post-webmail-backend:${WEBMAIL_VERSION:-latest}
    init: true
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
    volumes:
      - ${WEBMAIL_DATA_DIR:-webmail_data}:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  webmail_data:
